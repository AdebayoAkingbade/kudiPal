groups:
  - name: kudipal-api
    rules:
      - alert: KudiPalHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: KudiPal API 5xx rate is above 2 percent.

      - alert: KudiPalHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1.5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: KudiPal API p95 latency is above 1.5 seconds.

      - alert: KudiPalPaymentWebhookFailures
        expr: increase(http_server_requests_seconds_count{uri=~".*paystack.*",status=~"4..|5.."}[10m]) > 5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Paystack webhook endpoint is failing repeatedly.

      - alert: KudiPalNoTraffic
        expr: sum(rate(http_server_requests_seconds_count[15m])) == 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: KudiPal API has received no traffic for 30 minutes.

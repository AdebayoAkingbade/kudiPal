services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kudipal
      POSTGRES_USER: kudipal
      POSTGRES_PASSWORD: kudipal_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudipal -d kudipal"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/kudipal
      DATABASE_USERNAME: kudipal
      DATABASE_PASSWORD: kudipal_dev_password
      REDIS_HOST: redis
      JWT_JWK_SET_URI: http://localhost:8080/.well-known/jwks.json
      JWT_ISSUER_URI: http://localhost:8080
      WHATSAPP_CLOUD_VERIFY_TOKEN: kudipal-local-verify-token
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_WHATSAPP_NUMBER: ""
    ports:
      - "8081:8081"

volumes:
  postgres-data:
  redis-data:

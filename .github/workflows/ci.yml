name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kudipal
          POSTGRES_USER: kudipal
          POSTGRES_PASSWORD: kudipal_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kudipal -d kudipal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/kudipal
          DATABASE_USERNAME: kudipal
          DATABASE_PASSWORD: kudipal_dev_password
          JWT_JWK_SET_URI: http://localhost:8080/.well-known/jwks.json
          JWT_ISSUER_URI: http://localhost:8080

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

spring.application.name=kudipal-backend

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kudipal}
spring.datasource.username=${DATABASE_USERNAME:kudipal}
spring.datasource.password=${DATABASE_PASSWORD:kudipal_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# JPA and migrations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.schemas=marketplace,public
spring.flyway.default-schema=marketplace

# JWT resource server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8080}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}
supabase.anon.key=${SUPABASE_ANON_KEY:}

# Runtime
server.port=${SERVER_PORT:8081}
app.upload.storage-path=${APP_UPLOAD_STORAGE_PATH:uploads}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# AWS
spring.cloud.aws.region.static=${AWS_REGION:eu-west-1}
spring.cloud.aws.sqs.enabled=${AWS_SQS_ENABLED:false}
app.sqs.inbound-message-queue=${INBOUND_MESSAGE_QUEUE:kudipal-inbound-messages}
app.sqs.payment-event-queue=${PAYMENT_EVENT_QUEUE:kudipal-payment-events}

# WhatsApp Cloud API
whatsapp.cloud.api-version=${WHATSAPP_CLOUD_API_VERSION:v23.0}
whatsapp.cloud.access-token=${WHATSAPP_CLOUD_ACCESS_TOKEN:}
whatsapp.cloud.phone-number-id=${WHATSAPP_CLOUD_PHONE_NUMBER_ID:}
whatsapp.cloud.verify-token=${WHATSAPP_CLOUD_VERIFY_TOKEN:kudipal-verify-token}

# Legacy Twilio WhatsApp integration. Empty values keep local development in dry-run mode.
TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:}
TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:}
TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:}

# OpenAI
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}

# Paystack
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:}

# Marketplace flow
marketplace.reminder.minutes=${MARKETPLACE_REMINDER_MINUTES:30}
marketplace.prompt.rollover-cron=${MARKETPLACE_PROMPT_ROLLOVER_CRON:0 0 8 * * MON}
marketplace.security.pii-key=${PII_ENCRYPTION_KEY:}

# Actuator and OpenAPI
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}
